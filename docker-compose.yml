version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: connecta_postgres
    environment:
      POSTGRES_DB: connecta_db
      POSTGRES_USER: connecta_user
      POSTGRES_PASSWORD: connecta_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: connecta_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
